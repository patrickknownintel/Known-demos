<head>
  <meta charset="utf-8">
  <script>
    (function(){
      var k = 'known_demo_auth';
      if (sessionStorage.getItem(k) === '1') return;
      document.documentElement.style.visibility = 'hidden';
      document.addEventListener('DOMContentLoaded', function() {
        document.documentElement.style.visibility = '';
        var overlay = document.createElement('div');
        overlay.id = 'pw-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:#061A33;display:flex;align-items:center;justify-content:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
        overlay.innerHTML = '<div style="text-align:center;"><div style="width:36px;height:36px;background:white;border-radius:7px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d=\'M5 4h3v6l5-6h4l-6 8 6 8h-4l-5-6v6H5V4z\' fill=\'#061A33\'/></svg></div><div style="font-size:15px;font-weight:500;color:white;margin-bottom:6px;">Known</div><div style="font-size:12px;color:rgba(247,250,252,.4);margin-bottom:24px;">Enter your password to continue</div><input id=\'pw-input\' type=\'password\' placeholder=\'Password\' style=\'display:block;width:240px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:10px 14px;font-size:13px;color:white;outline:none;text-align:center;letter-spacing:.1em;\' /><div id=\'pw-error\' style=\'font-size:11px;color:#fc8181;margin-top:8px;min-height:16px;\'></div><button id=\'pw-btn\' style=\'margin-top:12px;width:240px;background:#0069C3;color:white;border:none;border-radius:7px;padding:10px;font-size:13px;font-weight:500;cursor:pointer;\'>Continue</button></div>';
        document.body.prepend(overlay);
        var input = document.getElementById('pw-input');
        var btn = document.getElementById('pw-btn');
        var err = document.getElementById('pw-error');
        input.focus();
        function attempt() {
          if (input.value === 'Ramrod') {
            sessionStorage.setItem(k, '1');
            overlay.remove();
          } else {
            err.textContent = 'Incorrect password';
            input.value = '';
            input.focus();
          }
        }
        btn.addEventListener('click', attempt);
        input.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
      });
    })();
  </script>
